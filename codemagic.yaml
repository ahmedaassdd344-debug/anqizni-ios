workflows:
  ios-workflow:
    name: Build Anqizni iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize iOS Platform
        script: flutter create --platforms=ios --org com.aistudio.sakwinch --project-name anqizni_ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS App (Unsigned)
        script: |
          flutter build ios --config-only --release --no-codesign
          cd ios
          export FLUTTER_BUILD_MODE=release
          export FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          export FLUTTER_APPLICATION_PATH=$CM_BUILD_DIR
          export FLUTTER_TARGET=lib/main.dart
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r Anqizni-iOS-Unsigned.ipa Payload
    artifacts:
      - Anqizni-iOS-Unsigned.ipa
