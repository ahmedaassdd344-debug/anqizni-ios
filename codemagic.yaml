workflows:
  ios-workflow:
    name: Build Anqizni iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize iOS Platform
        script: flutter create --platforms=ios --org com.aistudio.sakwinch --project-name anqizni_ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Setup Temporary Signing
        script: |
          keychain initialize
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=Apple Development: Anqizni Dev/OU=DEV/O=SAK/C=EG"
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -passout pass:1234
          keychain add-certificates --certificate cert.p12 --certificate-password 1234
      - name: Build iOS App
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Anqizni-iOS-Unsigned.ipa Payload
    artifacts:
      - Anqizni-iOS-Unsigned.ipa
