workflows:
  ios-workflow:
    name: Build Anqizni iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize iOS Platform
        script: flutter create --platforms=ios --org com.aistudio.sakwinch --project-name anqizni_ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS Bundle
        script: flutter build ios --simulator --debug
      - name: Package iOS App
        script: |
          cd build/ios/iphonesimulator
          zip -r ../../../Anqizni-iOS-App.zip Runner.app
    artifacts:
      - Anqizni-iOS-App.zip
