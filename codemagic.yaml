workflows:
  ios-workflow:
    name: Build Anqizni iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize iOS Platform
        script: flutter create --platforms=ios --org com.aistudio.sakwinch --project-name anqizni_ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Disable Code Signing in Xcode Project
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";//g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :CODE_SIGNING_ALLOWED string NO" ios/Runner/Info.plist || true
      - name: Build iOS App (Unsigned)
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Anqizni-iOS-Unsigned.ipa Payload
    artifacts:
      - Anqizni-iOS-Unsigned.ipa
