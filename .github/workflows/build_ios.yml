name: Build iOS App (Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize iOS Platform Files
        run: flutter create --platforms=ios --org com.aistudio.sakwinch --project-name anqizni_ios .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned for App Store / Signing)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Anqizni-iOS-Unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anqizni-iOS-Build
          path: Anqizni-iOS-Unsigned.ipa
